<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One More Surprise ✨</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#fff0f5,#ffdce8,#fff8fa);
    font-family:Arial,sans-serif;
    color:#51343d;
    overflow:hidden;
}

.container{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.card{
    width:100%;
    max-width:400px;
    background:rgba(255,255,255,.88);
    padding:38px 25px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 10px 35px rgba(100,50,70,.15);
}

.heart{
    font-size:55px;
    margin-bottom:15px;
    animation:beat 1.5s infinite;
}

@keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.12);}
}

h1{
    font-family:Georgia,serif;
    font-size:31px;
    color:#9b5269;
    margin-bottom:18px;
}

.message{
    font-family:Georgia,serif;
    font-size:18px;
    line-height:1.8;
    margin-bottom:25px;
}

.love{
    font-size:25px;
    color:#a85b73;
    margin:20px 0;
}

.small{
    font-size:14px;
    opacity:.65;
    font-style:italic;
}

</style>
</head>


<body>

<div class="container">

    <div class="card">

        <div class="heart">🤍</div>

        <h1>One More Surprise ✨</h1>

        <p class="message">
            If you reached till here...
            <br><br>
            I just want you to know that
            you are really special to me. 🥹
            <br><br>
            Thank you for being a beautiful
            part of my life.
        </p>

        <div class="love">
            I Love You, Bala ♡
        </div>

        <p class="small">
            Happy Boyfriend Day 🤍
        </p>

    </div>

</div>

</body>
</html>
